name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  release:
    name: Build release artifacts
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          target="dist/cagent_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$target"

          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$target/cagent${{ matrix.ext }}" ./cmd/cagent

          cp README.md "$target/"
          mkdir -p "$target/docs"
          cp -R docs/droid-settings "$target/docs/"

          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -r "cagent_${version}_${GOOS}_${GOARCH}.zip" "cagent_${version}_${GOOS}_${GOARCH}")
          else
            tar -C dist -czf "dist/cagent_${version}_${GOOS}_${GOARCH}.tar.gz" "cagent_${version}_${GOOS}_${GOARCH}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cagent_${{ github.ref_name || 'dev' }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
